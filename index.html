<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tűzkéz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: playful effects toy, dark stage, short Hungarian labels
   IDEA: a stage at night — the canvas is the stage, the hand is the torch
   PICTURE: full-bleed live canvas, burning hand (demo hand until a clip is loaded)
   COLOUR and TYPE: soot black, ember orange, hot yellow; Archivo 900 title, Archivo body
   LAYOUT: canvas fills the screen; title + status top-left; one compact control dock at the bottom */
:root{color-scheme:dark;--bg:#0a0605;--ink:#f7ede4;--mut:#bba89a;--ember:#ff7a1a;--hot:#ffd27a;--glass:rgba(18,10,7,.62);--line:rgba(255,220,190,.16)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:manipulation}
#vid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 70px 26px calc(14px + env(safe-area-inset-left));pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8);background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0))}
.top h1{margin:0;font-weight:900;font-size:32px;line-height:1.05;letter-spacing:-.01em;background:linear-gradient(180deg,#fff4cf,#ffb347 50%,#ff5a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.top p{margin:2px 0 0;font-size:13px;color:#fff;opacity:.85}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(14px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;gap:10px;justify-items:center;transition:transform .25s ease,opacity .25s ease}
.dock.off{transform:translateY(110%);opacity:0;pointer-events:none}
.dock .inner{width:min(560px,100%);display:grid;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hint{margin:0;font-size:14px;line-height:1.4;color:var(--mut);text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{appearance:none;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 16px;font:600 15px/1 Archivo,system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.sw:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.primary{width:100%;min-height:50px;font-size:16px;font-weight:700;color:#1d0c04;border:0;background:linear-gradient(180deg,#ffd98a,#ff8a24 60%,#f0601a);box-shadow:0 6px 24px rgba(255,110,30,.35)}
.btn[aria-pressed=true]{background:rgba(255,160,80,.2);border-color:rgba(255,170,90,.6)}
.btn.rec{border-color:rgba(255,80,60,.6)}
.btn.rec .dot{width:10px;height:10px;border-radius:50%;background:#ff3b30}
.btn.rec.on{background:#d62828;border-color:#d62828;color:#fff}
.btn.rec.on .dot{background:#fff;border-radius:2px}
.sws{display:flex;gap:10px;justify-content:center}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 3px var(--bg)}
.sw[aria-checked=true]{border-color:var(--ink)}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toggle{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 18px/1 Archivo,system-ui;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media (prefers-reduced-motion:reduce){.dock{transition:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Élő effekt: égő kéz"></canvas>
<video id="vid" playsinline muted loop preload="auto"></video>

<div class="top">
  <h1>Tűzkéz</h1>
  <p id="status">Indul…</p>
</div>
<button class="toggle" id="toggle" aria-label="Vezérlők elrejtése" aria-expanded="true">–</button>

<div class="dock" id="dock">
  <div class="inner">
    <p class="hint" id="hint">Engedélyezd a kamerát, és tartsd a kezed a képbe. Nyitott tenyér = nagyobb láng.</p>
    <button class="btn primary" id="camBtn" hidden>Kamera indítása</button>
    <div class="sws" role="radiogroup" aria-label="Láng színe" id="sws"></div>
    <div class="row">
      <button class="btn" id="flip" hidden>Kameraváltás</button>
      <button class="btn rec" id="rec" hidden><span class="dot"></span><span id="recLabel">Felvétel</span></button>
      <button class="btn" id="save" hidden>Mentés</button>
      <label class="btn" for="file" id="pick">Videóból</label>
      <input class="vh" id="file" type="file" accept="video/*">
    </div>
  </div>
</div>

<script>
{
const $ = s => document.querySelector(s);
const cv = $('#stage'), video = $('#vid'), statusEl = $('#status'), dock = $('#dock');
const PALETTES = [
  {name:'Narancs', sw:'#ff7a1a', c:[1,.95,.78, 1,.7,.2, .95,.3,.04, .22,.035,0], tint:[1,.5,.18]},
  {name:'Kék', sw:'#3d8bff', c:[.85,.95,1, .35,.72,1, .1,.28,.95, .06,.02,.22], tint:[.35,.55,1]},
  {name:'Zöld', sw:'#46e35a', c:[.92,1,.8, .5,1,.35, .1,.68,.16, 0,.14,.05], tint:[.4,1,.35]},
  {name:'Lila', sw:'#b45cff', c:[1,.88,1, .85,.42,1, .5,.12,.85, .12,0,.2], tint:[.7,.35,1]}
];
const st = {pal:0, mirror:false, mode:'demo', ready:false, lastVT:-1, lastDet:0, fps:30, recording:null, blob:null};
const setStatus = t => { statusEl.textContent = t; };

/* ---------- WebGL ---------- */
const gl = cv.getContext('webgl2', {alpha:false, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:true});
if (!gl) { setStatus('Ehhez WebGL2 kell, ez a nézet nem adja.'); throw new Error('no webgl2'); }
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
const prog = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
const unis = (p, names) => Object.fromEntries(names.map(n => [n, gl.getUniformLocation(p, n)]));

const bgP = prog(`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}`,
`#version 300 es
precision highp float;
uniform sampler2D u_tex;uniform vec2 u_res;uniform vec4 u_fit;uniform float u_mirror,u_has,u_dim;
uniform vec4 u_light[2];uniform vec3 u_tint;
out vec4 o;
void main(){
  vec2 px=vec2(gl_FragCoord.x,u_res.y-gl_FragCoord.y);
  vec3 c=vec3(.035,.022,.018)*(1.2-px.y/u_res.y*.5);
  if(u_has>.5){vec2 uv=(px-u_fit.xy)/u_fit.zw;if(u_mirror>.5)uv.x=1.-uv.x;if(all(greaterThanEqual(uv,vec2(0)))&&all(lessThanEqual(uv,vec2(1))))c=texture(u_tex,uv).rgb;}
  float l=0.;
  for(int i=0;i<2;i++){vec2 d=(px-u_light[i].xy)/max(u_light[i].z,1.);l+=u_light[i].w*exp(-dot(d,d));}
  c*=1.-u_dim;
  c+=c*l*u_tint*1.2+l*u_tint*(u_has>.5?.03:.14);
  o=vec4(c,1);
}`);
const bgU = unis(bgP, ['u_tex','u_res','u_fit','u_mirror','u_has','u_dim','u_light','u_tint']);

const ptP = prog(`#version 300 es
layout(location=0) in vec2 a_c;layout(location=1) in vec4 a_p;layout(location=2) in vec2 a_k;
uniform vec2 u_res;uniform float u_pass;
out vec2 v_uv;out float v_t,v_s,v_k;
void main(){
  bool smoke=a_k.x>.5&&a_k.x<1.5;
  if(smoke!=(u_pass>.5)){gl_Position=vec4(2,2,2,1);return;}
  vec2 sz=vec2(a_p.z)*(a_k.x<.5?vec2(.8,1.3):vec2(1));
  vec2 px=a_p.xy+a_c*sz*.5;
  gl_Position=vec4(px.x/u_res.x*2.-1.,1.-px.y/u_res.y*2.,0,1);
  v_uv=a_c*.5+.5;v_t=a_p.w;v_s=a_k.y;v_k=a_k.x;
}`,
`#version 300 es
precision highp float;
in vec2 v_uv;in float v_t,v_s,v_k;
uniform vec3 u_c[4];uniform float u_time,u_gain;
out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
vec3 ramp(float t){t=clamp(t,0.,1.)*3.;return t<1.?mix(u_c[0],u_c[1],t):t<2.?mix(u_c[1],u_c[2],t-1.):mix(u_c[2],u_c[3],t-2.);}
void main(){
  vec2 q=v_uv*2.-1.;float d=length(q);if(d>1.)discard;
  if(v_k>1.5){float a=pow(1.-d,2.)*(1.-v_t)*(.55+.45*sin(u_time*37.+v_s*61.));o=vec4(ramp(.08+v_t*.45)*a*1.6,1);return;}
  float nz=n(v_uv*2.6+vec2(v_s*17.,v_s*9.-u_time*2.2))*.65+n(v_uv*5.3+vec2(v_s*5.,-u_time*3.7))*.35;
  if(v_k>.5){float a=smoothstep(1.,.15,d)*(.45+.55*nz)*(1.-v_t)*smoothstep(0.,.25,v_t)*.11;o=vec4(vec3(.06,.05,.045)*a,a);return;}
  float shape=clamp(1.-d+(nz-.5)*.7,0.,1.);
  float a=pow(shape,1.7)*pow(1.-v_t,1.25)*smoothstep(0.,.07,v_t);
  o=vec4(ramp(v_t*.95)*a*u_gain,1);
}`);
const ptU = unis(ptP, ['u_res','u_pass','u_c','u_time','u_gain']);

const MAX = 9000, STRIDE = 6;
const X = new Float32Array(MAX), Y = new Float32Array(MAX), VX = new Float32Array(MAX), VY = new Float32Array(MAX),
      L = new Float32Array(MAX), M = new Float32Array(MAX), S0 = new Float32Array(MAX), SC = new Float32Array(MAX),
      SD = new Float32Array(MAX), K = new Uint8Array(MAX), inst = new Float32Array(MAX * STRIDE);
let n = 0;
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ib); gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, STRIDE * 4, 0); gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, STRIDE * 4, 16); gl.vertexAttribDivisor(2, 1);
gl.bindVertexArray(null);
const bgVao = gl.createVertexArray();
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));

function add(x, y, vx, vy, life, size, kind, scale) {
  if (n >= MAX) return;
  X[n] = x; Y[n] = y; VX[n] = vx; VY[n] = vy; L[n] = 0; M[n] = life; S0[n] = size; K[n] = kind; SC[n] = scale; SD[n] = Math.random(); n++;
}
function step(dt, T) {
  let i = 0;
  while (i < n) {
    L[i] += dt;
    if (L[i] >= M[i]) { n--; X[i]=X[n];Y[i]=Y[n];VX[i]=VX[n];VY[i]=VY[n];L[i]=L[n];M[i]=M[n];S0[i]=S0[n];K[i]=K[n];SC[i]=SC[n];SD[i]=SD[n]; continue; }
    const k = K[i], s = SC[i];
    VY[i] -= (k === 0 ? 1.7 : k === 1 ? .4 : .3) * s * dt;
    const w = Math.sin(Y[i] / s * 2.7 + T * 5 + SD[i] * 6.28) + .6 * Math.sin(Y[i] / s * 5.3 - T * 7 + SD[i] * 3);
    VX[i] += w * s * (k === 1 ? .5 : 2.2) * dt;
    const dr = Math.exp(-(k === 2 ? .5 : 1.8) * dt); VX[i] *= dr; VY[i] *= dr;
    X[i] += VX[i] * dt; Y[i] += VY[i] * dt; i++;
  }
}

/* ---------- hands ---------- */
const BONES = [0,1,1,2,2,3,3,4,0,5,5,6,6,7,7,8,5,9,9,10,10,11,11,12,9,13,13,14,14,15,15,16,13,17,0,17,17,18,18,19,19,20];
const TIPS = [4,8,12,16,20], PALM = [0,5,9,13,17];
let hands = [];
function ingest(list, dt) {
  const used = new Set();
  for (const h of hands) h.seen = false;
  for (const q of list) {
    const S = Math.max(12, Math.hypot(q[18] - q[0], q[19] - q[1]));
    let best = null, bd = 1e9;
    for (const h of hands) { if (used.has(h)) continue; const d = Math.hypot(h.p[0] - q[0], h.p[1] - q[1]); if (d < bd) { bd = d; best = h; } }
    if (best && bd < S * 3) {
      used.add(best);
      const kk = Math.min(.9, .5 + bd / (S * 2));
      for (let i = 0; i < 42; i++) { const nv = best.p[i] + (q[i] - best.p[i]) * kk; best.v[i] += ((nv - best.p[i]) / Math.max(dt, 1 / 120) - best.v[i]) * .5; best.p[i] = nv; }
      best.S += (S - best.S) * .5; best.seen = true;
    } else {
      const h = {p: Float32Array.from(q), v: new Float32Array(42), a: 0, seen: true, S, pow: 1, acc: new Float32Array(4)};
      hands.push(h); used.add(h);
    }
  }
}
const rnd = Math.random;
function emit(h, dt) {
  const a = h.a * h.pow; if (a < .02) return;
  const p = h.p, v = h.v, S = h.S;
  const at = (i0, i1, u) => [p[i0*2] + (p[i1*2] - p[i0*2]) * u, p[i0*2+1] + (p[i1*2+1] - p[i0*2+1]) * u, v[i0*2] + (v[i1*2] - v[i0*2]) * u, v[i0*2+1] + (v[i1*2+1] - v[i0*2+1]) * u];
  h.acc[0] += dt * a * 1100;
  while (h.acc[0] >= 1) { h.acc[0]--; const b = (rnd() * 21 | 0) * 2, [x, y, vx, vy] = at(BONES[b], BONES[b+1], rnd()), r = S * .17 * Math.sqrt(rnd()), an = rnd() * 6.283;
    add(x + Math.cos(an) * r, y + Math.sin(an) * r * .7, vx * .3 + (rnd() - .5) * S * .5, vy * .3 - (.15 + rnd() * .55) * S, .24 + rnd() * .34, (.3 + rnd() * .32) * S, 0, S); }
  h.acc[1] += dt * a * 320;
  while (h.acc[1] >= 1) { h.acc[1]--; const t = TIPS[rnd() * 5 | 0], [x, y, vx, vy] = at(t, t - 1, rnd() * .5);
    add(x + (rnd() - .5) * S * .12, y, vx * .3 + (rnd() - .5) * S * .35, vy * .3 - (.5 + rnd() * .8) * S, .3 + rnd() * .38, (.22 + rnd() * .26) * S, 0, S); }
  h.acc[2] += dt * a * 30;
  while (h.acc[2] >= 1) { h.acc[2]--; const b = (rnd() * 21 | 0) * 2, [x, y, vx, vy] = at(BONES[b], BONES[b+1], rnd());
    add(x, y, vx * .4 + (rnd() - .5) * S * 1.6, vy * .4 - (1.4 + rnd() * 2.2) * S, .7 + rnd() * .9, Math.max(3, S * (.03 + rnd() * .04)), 2, S); }
  h.acc[3] += dt * a * 24;
  while (h.acc[3] >= 1) { h.acc[3]--; const t = TIPS[rnd() * 5 | 0];
    add(p[t*2] + (rnd() - .5) * S * .4, p[t*2+1] - S * (.5 + rnd() * .4), v[t*2] * .2, -(.5 + rnd() * .5) * S, 1.2 + rnd() * .9, (.6 + rnd() * .6) * S, 1, S); }
}

/* demo hand: procedural pose, used until a video is loaded */
const REST = [[0,0],[-.36,-.16],[-.62,-.38],[-.8,-.6],[-.94,-.8],[-.3,-.95],[-.36,-1.35],[-.39,-1.6],[-.41,-1.82],[0,-1],[0,-1.45],[0,-1.73],[0,-1.97],[.27,-.95],[.31,-1.36],[.33,-1.61],[.35,-1.82],[.5,-.83],[.6,-1.13],[.66,-1.33],[.7,-1.5]];
function demoHand(T, W, H) {
  const S = Math.min(W, H) * (W < H ? .23 : .19), th = .32 * Math.sin(T * .8), curl = .5 - .5 * Math.cos(T * .9);
  const cx = W / 2 + W * .16 * Math.sin(T * .55), cy = H * (W < H ? .52 : .62) + H * .04 * Math.sin(T * 1.1);
  const out = new Array(42), c = Math.cos(th), s = Math.sin(th);
  for (let i = 0; i < 21; i++) {
    let [x, y] = REST[i];
    const f = i === 0 ? -1 : (i - 1) % 4, mcp = i === 0 ? 0 : i - f;
    if (i > 0 && f > 0) { const k = curl * .7 * (f / 3); x = REST[mcp][0] + (x - REST[mcp][0]) * (1 - k); y = REST[mcp][1] + (y - REST[mcp][1]) * (1 - k) + k * .25; }
    out[i*2] = cx + (x * c - y * s) * S; out[i*2+1] = cy + (x * s + y * c) * S;
  }
  return out;
}

/* ---------- tracking ---------- */
let landmarker = null, delegate = 'GPU', Hand = null, files = null, model = '';
const url = p => new URL(p, document.baseURI).href;
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2';
const CDN_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
async function makeLandmarker(d) {
  return Hand.createFromOptions(files, {baseOptions: {modelAssetPath: model, delegate: d}, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: .5, minHandPresenceConfidence: .5, minTrackingConfidence: .5});
}
(async () => {
  try {
    let local = false;
    try { if (location.protocol.startsWith('http')) { const r = await fetch(url('mp/hand_landmarker.task'), {method: 'HEAD'}); local = r.ok && !(r.headers.get('content-type') || '').includes('text/html'); } } catch (_) {}
    const base = local ? url('mp') : CDN;
    model = local ? url('mp/hand_landmarker.task') : CDN_MODEL;
    const lib = await import(base + '/vision_bundle.mjs');
    Hand = lib.HandLandmarker;
    files = {wasmLoaderPath: base + '/wasm/vision_wasm_internal.js', wasmBinaryPath: base + '/wasm/vision_wasm_internal.wasm'};
    try { landmarker = await makeLandmarker('GPU'); } catch (e) { console.warn('GPU delegate failed, using CPU', e); delegate = 'CPU'; landmarker = await makeLandmarker('CPU'); }
    st.ready = true;
    if (st.mode === 'demo') setStatus(st.camError || 'Kézkövetés kész');
  } catch (e) { console.error(e); setStatus('A kézkövető nem töltött be: ' + (e && e.message || e)); }
})();

function detect(now) {
  if (!landmarker || video.readyState < 2 || video.currentTime === st.lastVT) return;
  st.lastVT = video.currentTime;
  let r;
  try { r = landmarker.detectForVideo(video, now); }
  catch (e) {
    console.warn('detect failed', e);
    if (delegate === 'GPU') { delegate = 'CPU'; const old = landmarker; landmarker = null; try { old.close(); } catch (_) {} makeLandmarker('CPU').then(l => landmarker = l).catch(err => setStatus('Kézkövetés hiba: ' + err.message)); }
    return;
  }
  const dt = st.lastDet ? (now - st.lastDet) / 1000 : 1 / 30; st.lastDet = now;
  const f = fit(), list = (r.landmarks || []).map(lm => { const q = new Array(42); lm.forEach((pt, i) => { q[i*2] = f.x + (st.mirror ? 1 - pt.x : pt.x) * f.w; q[i*2+1] = f.y + pt.y * f.h; }); return q; });
  ingest(list, dt);
  st.handCount = list.length;
}

/* ---------- layout ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5), w = cv.clientWidth, h = cv.clientHeight;
  let W = Math.round(w * dpr), H = Math.round(h * dpr); const cap = 1700 / Math.max(W, H); if (cap < 1) { W = Math.round(W * cap); H = Math.round(H * cap); }
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
}
function fit() {
  const W = cv.width, H = cv.height, vw = video.videoWidth || W, vh = video.videoHeight || H, r = (vw / vh) / (W / H);
  const s = Math.max(r, 1 / r) < 1.3 ? Math.max(W / vw, H / vh) : Math.min(W / vw, H / vh);
  return {x: (W - vw * s) / 2, y: (H - vh * s) / 2, w: vw * s, h: vh * s};
}

/* ---------- loop ---------- */
let last = performance.now(), T = 0, fpsAcc = 0, fpsN = 0, fpsT = 0;
const lights = new Float32Array(8);
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; T += dt;
  resize();
  const W = cv.width, H = cv.height;
  const hasVid = st.mode !== 'demo' && video.readyState >= 2;
  if (st.mode === 'demo') { const q = demoHand(T, W, H); ingest([q], dt); }
  else if (hasVid) detect(now);
  for (const h of hands) {
    h.a = Math.max(0, Math.min(1, h.a + (h.seen ? 7 : -3.5) * dt));
    let o = 0; for (const t of TIPS) o += Math.hypot(h.p[t*2] - h.p[0], h.p[t*2+1] - h.p[1]); o /= 5 * h.S;
    const target = .55 + .45 * Math.min(1, Math.max(0, (o - 1.2) / .75));
    h.pow += (target - h.pow) * Math.min(1, dt * 5);
    emit(h, dt);
  }
  hands = hands.filter(h => h.a > 0 || h.seen);
  step(dt, T);

  lights.fill(0); let maxL = 0;
  hands.slice().sort((a, b) => b.a - a.a).slice(0, 2).forEach((h, i) => {
    let cx = 0, cy = 0; for (const j of PALM) { cx += h.p[j*2]; cy += h.p[j*2+1]; }
    const fl = .82 + .18 * Math.sin(T * 13 + i) * Math.sin(T * 7.3 + i * 2), w = h.a * h.pow * .95 * fl;
    lights.set([cx / 5, cy / 5 - h.S * .4, h.S * 2.6, w * .6], i * 4); maxL = Math.max(maxL, w);
  });

  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(bgP); gl.bindVertexArray(bgVao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  if (hasVid) { try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch (e) {} }
  const f = fit(), pal = PALETTES[st.pal];
  gl.uniform1i(bgU.u_tex, 0); gl.uniform2f(bgU.u_res, W, H); gl.uniform4f(bgU.u_fit, f.x, f.y, f.w, f.h);
  gl.uniform1f(bgU.u_mirror, st.mirror ? 1 : 0); gl.uniform1f(bgU.u_has, hasVid ? 1 : 0); gl.uniform1f(bgU.u_dim, maxL * .25);
  gl.uniform4fv(bgU.u_light, lights); gl.uniform3fv(bgU.u_tint, pal.tint);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  for (let i = 0, o = 0; i < n; i++, o += STRIDE) {
    const t = L[i] / M[i], k = K[i];
    inst[o] = X[i]; inst[o+1] = Y[i]; inst[o+2] = k === 0 ? S0[i] * (1 - .6 * t) : k === 1 ? S0[i] * (.5 + 1.1 * t) : S0[i];
    inst[o+3] = t; inst[o+4] = k; inst[o+5] = SD[i];
  }
  gl.useProgram(ptP); gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, n * STRIDE);
  gl.uniform2f(ptU.u_res, W, H); gl.uniform1f(ptU.u_time, T); gl.uniform3fv(ptU.u_c, pal.c); gl.uniform1f(ptU.u_gain, hasVid ? .32 : .4);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(ptU.u_pass, 1); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  gl.blendFunc(gl.ONE, gl.ONE); gl.uniform1f(ptU.u_pass, 0); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  gl.bindVertexArray(null);

  fpsAcc += dt; fpsN++;
  if (now - fpsT > 1000) {
    st.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; fpsT = now;
    if (st.mode !== 'demo' && st.ready && !st.recording && now > (st.hold || 0)) setStatus(`${st.handCount ? st.handCount + ' kéz' : 'Nincs kéz a képen'} · ${st.fps} fps`);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- controls ---------- */
const sws = $('#sws');
sws.innerHTML = PALETTES.map((p, i) => `<button class="sw" role="radio" aria-checked="${i === 0}" aria-label="${p.name}" title="${p.name}" style="--c:${p.sw}" data-i="${i}"></button>`).join('');
sws.addEventListener('click', e => { const b = e.target.closest('.sw'); if (!b) return; st.pal = +b.dataset.i; sws.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-checked', x === b)); });
const camBtn = $('#camBtn'), flipBtn = $('#flip'), recBtn = $('#rec'), saveBtn = $('#save'), recLabel = $('#recLabel'), hint = $('#hint');
$('#toggle').addEventListener('click', e => { const off = dock.classList.toggle('off'); e.currentTarget.textContent = off ? '+' : '–'; e.currentTarget.setAttribute('aria-expanded', !off); e.currentTarget.setAttribute('aria-label', off ? 'Vezérlők mutatása' : 'Vezérlők elrejtése'); });

/* camera */
let stream = null, facing = 'user';
const stopStream = () => { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
function camFailed(msg) {
  st.camError = msg; setStatus(msg);
  if (st.mode === 'camera') st.mode = 'demo';
  camBtn.hidden = false; hint.hidden = false; flipBtn.hidden = true; recBtn.hidden = st.mode === 'demo';
}
async function startCamera() {
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFailed('A kamerához https cím kell.');
  setStatus('Kamera indítása…');
  stopStream();
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}, frameRate: {ideal: 30}}, audio: false});
  } catch (e) {
    return camFailed(e && e.name === 'NotAllowedError' ? 'Nincs kamera-engedély. Koppints a gombra, vagy: Beállítások › Safari › Kamera.' : 'A kamera nem indult: ' + (e && e.message || e));
  }
  if (video.src) { URL.revokeObjectURL(video.src); video.removeAttribute('src'); }
  video.srcObject = stream; video.muted = true; video.loop = false;
  try { await video.play(); } catch (_) {}
  st.mode = 'camera'; st.camError = ''; st.mirror = facing === 'user'; st.lastVT = -1; hands = []; n = 0;
  camBtn.hidden = true; hint.hidden = true; recBtn.hidden = !canRecord();
  setStatus(st.ready ? 'Élő' : 'Kézkövető még töltődik…');
  try { const devs = await navigator.mediaDevices.enumerateDevices(); flipBtn.hidden = devs.filter(d => d.kind === 'videoinput').length < 2; } catch (_) {}
}
camBtn.addEventListener('click', startCamera);
flipBtn.addEventListener('click', () => { if (st.recording) return; facing = facing === 'user' ? 'environment' : 'user'; startCamera(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && st.mode === 'camera' && (!stream || stream.getVideoTracks().every(t => t.readyState === 'ended'))) startCamera();
});

/* video file fallback */
$('#file').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file || st.recording) return;
  stopStream(); video.srcObject = null;
  if (video.src) URL.revokeObjectURL(video.src);
  video.src = URL.createObjectURL(file); video.loop = true; video.muted = true;
  st.mode = 'video'; st.mirror = false; st.lastVT = -1; hands = []; n = 0;
  camBtn.textContent = 'Vissza a kamerához'; camBtn.hidden = false; hint.hidden = true; flipBtn.hidden = true; recBtn.hidden = !canRecord();
  setStatus(st.ready ? 'Videó betöltve' : 'Kézkövető még töltődik…');
  try { await video.play(); } catch (_) { setStatus('Koppints a képre a lejátszáshoz.'); }
  e.target.value = '';
});
cv.addEventListener('click', () => { if (st.mode !== 'demo' && video.paused) video.play().catch(() => {}); });

/* recording: canvas → mp4 (Safari) / webm, then share sheet or download */
function canRecord() { return !!(window.MediaRecorder && cv.captureStream); }
function pickMime() { for (const m of ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (_) {} } return ''; }
let tick = 0;
recBtn.addEventListener('click', () => {
  if (st.recording) { st.recording.stop(); return; }
  const mime = pickMime(), chunks = [];
  let rec;
  try { rec = new MediaRecorder(cv.captureStream(30), mime ? {mimeType: mime, videoBitsPerSecond: 8e6} : undefined); }
  catch (e) { setStatus('A felvétel ebben a böngészőben nem megy.'); return; }
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = () => {
    clearInterval(tick); st.recording = null; recBtn.classList.remove('on'); recLabel.textContent = 'Felvétel';
    if (!chunks.length) { setStatus('Üres felvétel.'); return; }
    const type = rec.mimeType || mime || 'video/mp4';
    st.blob = new Blob(chunks, {type}); st.ext = /mp4/.test(type) ? 'mp4' : 'webm';
    saveBtn.textContent = `Mentés (${(st.blob.size / 1048576).toFixed(1)} MB)`; saveBtn.hidden = false;
    st.hold = performance.now() + 6000; setStatus('Kész – Mentés › Videó mentése = Fotók');
  };
  st.recording = rec; st.blob = null; saveBtn.hidden = true;
  rec.start(500); recBtn.classList.add('on'); recLabel.textContent = 'Stop';
  const t0 = performance.now();
  tick = setInterval(() => setStatus(`● Felvétel ${Math.floor((performance.now() - t0) / 1000)} mp`), 250);
});
saveBtn.addEventListener('click', async () => {
  if (!st.blob) return;
  const file = new File([st.blob], `tuzkez-${Date.now()}.${st.ext}`, {type: st.blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); setStatus('Kész.'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setStatus('Letöltve.');
});

startCamera();
}
</script>
</body>
</html>
